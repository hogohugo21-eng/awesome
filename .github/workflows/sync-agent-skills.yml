name: Sync Agent Skills Catalog

on:
  workflow_dispatch:
  schedule:
    # Daily 03:17 UTC. Non-round minute reduces GitHub Actions schedule congestion.
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: sync-agent-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Discover upstream skills
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_skills.py

      - name: Commit catalog changes
        run: |
          if git diff --quiet -- catalog/; then
            echo "No upstream changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/
          git commit -m "chore: sync upstream agent skills"
          git push
